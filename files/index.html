<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/icons/logo.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/files/fonts.css" />
    <link rel="stylesheet" href="/files/style.css" />
    <link rel="scriptsheet" href="/files/script.js" />
    <title>Fotogram</title>
  </head>
  <body>
    <!-- Kopfzeile -->
    <header>
      <section>
        <img src="/assets/icons/logo.svg" alt="Das Logo von Fotogram" />
        <img src="/assets/icons/title.svg" alt="Der Titel von Fotogram" />
      </section>
    </header>
    <!-- Der Inhalt der Webseite -->
    <main>
      <article class="photoalbum">
        <p>Your personal photo album</p>
        <!-- Die Bilderreihe -->
        <section class="gallery">
          <ul>
            <li>
              <button onclick="openDialog()">
                <img
                  src="../assets/images/alaska-810433_1280.jpg"
                  alt="Bild 1: Alaska"
                />
              </button>
            </li>
          </ul>
        </section>
        <!-- Das Dialogfenster -->
        <section>
          <dialog>
            <article>
              <section class="dialog_head">
                <h2>alaska-810433_1280</h2>
                <button class="close">
                  <img
                    src="../assets/icons/close.svg"
                    alt="Kreuz zum Schließen des Fensters"
                  />
                </button>
              </section>
              <img
                src="../assets/images/alaska-810433_1280.jpg"
                alt="Bild in Nahaufnahme"
              />
              <section class="dialog_foot">
                <button class="arrow_left">
                  <img
                    src="../assets/icons/arrow_red.svg"
                    alt="Roter Pfeil der nach links zeigt"
                  />
                </button>
                <p>1/12</p>
                <button class="arrow_right">
                  <img
                    src="../assets/icons/arrow_red.svg"
                    alt="Roter Pfeil der nach rechts zeigt"
                  />
                </button>
              </section>
            </article>
          </dialog>
        </section>
      </article>
    </main>
    <!-- Fußzeile -->
    <footer>
      <article>
        <section class="developer_akademie">
          <img src="/assets/icons/da_logo.svg" alt="Das Logo der DA" />
          <img src="/assets/icons/da_title.svg" alt="Der Name der DA" />
        </section>
        <section class="copyright">
          <p>© 2023 Developer Akademie GmbH</p>
        </section>
      </article>
    </footer>
  </body>
</html>
