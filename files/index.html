<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/icons/logo.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/files/fonts.css" />
    <link rel="stylesheet" href="/files/style.css" />
    <link rel="scriptsheet" href="/files/script.js" />
    <title>Fotogram</title>
  </head>
  <body>
    <!-- Kopfzeile -->
    <header>
      <section>
        <img src="/assets/icons/logo.svg" alt="Das Logo von Fotogram" />
        <img src="/assets/icons/title.svg" alt="Der Titel von Fotogram" />
      </section>
    </header>
    <!-- Der Inhalt der Webseite -->
    <main>
      <article class="photoalbum">
        <p>Your personal photo album</p>
        <!-- Die Bilderreihe -->
        <section class="gallery">
          <ul>
            <li>
              <img
                src="../assets/images/alaska-810433_1280.jpg"
                alt="Bild 1: Alaska"
              />
            </li>
          </ul>
        </section>
      </article>
    </main>
    <!-- Fußzeile -->
    <footer>
      <article>
        <section class="developer_akademie">
          <img src="/assets/icons/da_logo.svg" alt="Das Logo der DA" />
          <img src="/assets/icons/da_title.svg" alt="Der Name der DA" />
        </section>
        <section class="copyright">
          <p>© 2023 Developer Akademie GmbH</p>
        </section>
      </article>
    </footer>
  </body>
</html>
