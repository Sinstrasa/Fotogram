<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../assets/icons/logo.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <title>Fotogram</title>
  </head>
  <body id="indexBody" onload="initialise()">
    <!-- Kopfzeile -->
    <header>
      <section>
        <img src="../assets/icons/logo.svg" alt="Das Logo von Fotogram" />
        <img src="../assets/icons/title.svg" alt="Der Titel von Fotogram" />
      </section>
    </header>
    <!-- Der Inhalt der Webseite -->
    <main>
      <article class="photoalbum">
        <h1>Your personal photo album</h1>
        <!-- Die Bilderreihe -->
        <section class="gallery">
          <ul id="list"></ul>
        </section>
        <!-- Das Dialogfenster -->
        <section>
          <dialog class="dialogfenster" id="dialog_window">
            <article>
              <section class="dialog_kopf" id="dialog_head">
                <div class="photoName" id="pictureName"></div>
                <button class="close" onclick="closeDialog()">
                  <img
                    class="cross"
                    src="../assets/icons/close.svg"
                    alt="Kreuz zum Schließen des Fensters"
                  />
                </button>
              </section>
              <figure class="photo" id="picture"></figure>
              <nav class="dialog_fuß" id="dialog_foot"></nav>
            </article>
          </dialog>
        </section>
      </article>
    </main>
    <!-- Fußzeile -->
    <footer>
      <article>
        <section class="developer_akademie">
          <img src="../assets/icons/da_logo.svg" alt="Das Logo der DA" />
          <img src="../assets/icons/da_title.svg" alt="Der Name der DA" />
        </section>
        <section class="copyright">
          <p>© 2023 Developer Akademie GmbH</p>
        </section>
        <section>
          <a href="../files/imprint.html" tabindex="0">Impressum</a>
        </section>
      </article>
    </footer>
  </body>
</html>
